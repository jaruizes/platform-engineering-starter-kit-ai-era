[project]
name = "platform-mcp"
version = "0.1.0"
description = "Platform MCP server and console for the Platform Engineering Starter Kit"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.3.0",
  "kubernetes==37.0.1",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
platform-mcp = "platform_mcp.mcp_server:main"
platform-console = "platform_mcp.console:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["platform_mcp"]

[tool.setuptools.package-data]
platform_mcp = ["static/*.html"]
