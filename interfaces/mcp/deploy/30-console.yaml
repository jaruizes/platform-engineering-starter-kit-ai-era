apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-console
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-console
    spec:
      serviceAccountName: platform-console
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform
          image: platform-starter-kit/platform-mcp:dev
          imagePullPolicy: Never
          command: [platform-console]
          env:
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: platform-console
  namespace: platform-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: platform-console
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
