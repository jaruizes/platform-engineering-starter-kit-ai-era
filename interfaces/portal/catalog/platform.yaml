# The platform itself: what it offers and how humans and agents reach it.
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: internal-developer-platform
  title: Internal Developer Platform
  description: Golden Paths for developers and AI agents, inside the same guardrails.
spec:
  owner: platform-team
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: ephemeral-environments
  title: Ephemeral environments
  description: Environments and services created through the Golden Paths, by humans or agents.
spec:
  owner: platform-team
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: platform-mcp
  title: Platform MCP server
  description: >-
    How AI agents act on the platform. Exposes the Golden Paths as MCP tools,
    with the agent identity, so the agent guardrails apply.
  annotations:
    backstage.io/source-location: url:https://github.com/jaruizes/platform-engineering-starter-kit-ai-era/blob/main/interfaces/mcp/
    backstage.io/kubernetes-id: platform-mcp
    backstage.io/kubernetes-namespace: platform-system
    backstage.io/kubernetes-label-selector: app.kubernetes.io/name=platform-mcp
spec:
  type: service
  lifecycle: experimental
  owner: platform-team
  system: internal-developer-platform
  providesApis: [platform-mcp]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: platform-console
  title: Platform console
  description: Approvals of agent requests and AI-era metrics. Also shown in the portal.
  annotations:
    backstage.io/source-location: url:https://github.com/jaruizes/platform-engineering-starter-kit-ai-era/blob/main/interfaces/mcp/
    backstage.io/kubernetes-id: platform-console
    backstage.io/kubernetes-namespace: platform-system
    backstage.io/kubernetes-label-selector: app.kubernetes.io/name=platform-console
  links:
    - url: http://localhost:8080
      title: Console
spec:
  type: website
  lifecycle: experimental
  owner: platform-team
  system: internal-developer-platform
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: portal
  title: Developer portal
  description: >-
    This Backstage. Software Templates for humans, and read-only context for
    AI agents through MCP.
  annotations:
    backstage.io/source-location: url:https://github.com/jaruizes/platform-engineering-starter-kit-ai-era/blob/main/interfaces/portal/
spec:
  type: website
  lifecycle: experimental
  owner: platform-team
  system: internal-developer-platform
  providesApis: [portal-mcp]
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: platform-mcp
  title: Platform MCP (actions)
  description: >-
    Golden Paths as tools for AI agents: request_environment, deploy_service,
    get_approval_status and more. Requests outside the guardrails go to a human.
  tags: [mcp]
spec:
  type: mcp-server
  lifecycle: experimental
  owner: platform-team
  system: internal-developer-platform
  remotes:
    - type: streamable-http
      url: http://localhost:8081/mcp
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: portal-mcp
  title: Portal MCP (context)
  description: >-
    Read-only context for AI agents: the catalog (who owns what, which
    environments exist and who asked for them), live Kubernetes status, search,
    team usage and pending approvals.
  tags: [mcp]
spec:
  type: mcp-server
  lifecycle: experimental
  owner: platform-team
  system: internal-developer-platform
  remotes:
    - type: streamable-http
      url: http://localhost:7007/api/mcp-actions/v1/context
