# The platform pipeline (Gitea Actions, on the platform runner). On every
# push to main it runs the checks, builds the image with Jib and deploys it
# with GitOps: it writes the image into deploy/app.yaml and Argo CD applies
# the change to the environment. Changes to deploy/ alone are applied by
# Argo CD without a new build.
name: deliver
on:
  push:
    branches: [main]
    paths-ignore: ["deploy/**", ".platform/quality/results.json"]
jobs:
  deliver:
    runs-on: platform
    steps:
      - name: Check out
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find . -mindepth 1 -delete
          git clone -q "http://pipeline:${TOKEN}@${{ vars.PLATFORM_GIT_HOST }}/${GITHUB_REPOSITORY}.git" .
          git checkout -q "$GITHUB_SHA"

      # Integration tests need Docker (Testcontainers), which the runner does
      # not have: they run with ./mvnw verify on a laptop.
      - name: Unit tests and architecture rules
        run: ./mvnw -B -ntp verify -DskipITs

      - name: Optional SonarQube analysis
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_HOST_URL" ]; then
            ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_TOKEN" \
              || echo "SonarQube analysis did not complete; deterministic quality policy remains authoritative."
          else
            echo "SonarQube is not configured; deterministic platform gate remains authoritative."
          fi

      - name: Deterministic quality gate
        if: always()
        run: python3 .platform/quality/gate.py --architecture backend-spring-v2

      - name: Publish commit-linked quality evidence
        if: always()
        run: |
          if [ ! -f .platform/quality/results.json ]; then
            echo "No quality evidence was generated."
            exit 0
          fi
          git config user.name "Platform quality gate"
          git config user.email quality@starterkit.local
          git checkout -B platform-quality-evidence
          git add .platform/quality/results.json
          git commit -m "Quality evidence for $GITHUB_SHA"
          git push --force origin HEAD:platform-quality-evidence

      - name: Build and push the image
        run: |
          IMAGE="${{ vars.SERVICE_IMAGE_REPOSITORY }}:${GITHUB_REPOSITORY#*/}-${GITHUB_SHA:0:12}"
          ./mvnw -B -ntp -DskipTests compile jib:build -Dimage="$IMAGE" ${{ vars.JIB_FLAGS }}
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy (GitOps)
        run: |
          if grep -q '^  image:' deploy/app.yaml; then
            sed -i "s|^  image:.*|  image: $IMAGE|" deploy/app.yaml
          else
            echo "deploy/app.yaml has no environment: the image is built but not deployed."
          fi
          git -c user.name="Platform pipeline" -c user.email=pipeline@starterkit.local \
            add deploy/app.yaml
          if ! git diff --cached --quiet; then
            git -c user.name="Platform pipeline" -c user.email=pipeline@starterkit.local \
              commit -m "Deploy $IMAGE after quality gate for $GITHUB_SHA"
            git push -q origin HEAD:main
            echo "Deployed $IMAGE: Argo CD applies it to the environment."
          fi
