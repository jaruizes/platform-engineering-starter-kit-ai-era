# Sample organization for the demo. In a real setup this comes from your
# identity provider (Entra ID, Okta, GitHub teams...).
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
  title: Platform team
spec:
  type: team
  children: []
  members: [ana]
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: checkout
  title: Checkout
spec:
  type: team
  children: []
  members: [marta]
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: payments
  title: Payments
spec:
  type: team
  children: []
  members: [luis]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: ana
spec:
  profile:
    displayName: Ana
  memberOf: [platform-team]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: marta
spec:
  profile:
    displayName: Marta
  memberOf: [checkout]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: luis
spec:
  profile:
    displayName: Luis
  memberOf: [payments]
