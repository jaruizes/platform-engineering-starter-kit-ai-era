{% if values.environment -%}
# How this service runs in its environment, through the new-service Golden
# Path. Argo CD applies this folder (GitOps): change it with a commit. The
# pipeline writes the image on every build of main; until the first build
# there is none, and nothing runs.
apiVersion: platform.starterkit.dev/v1alpha1
kind: App
metadata:
  name: ${{ values.name }}
  namespace: env-${{ values.environment }}
  annotations:
    platform.starterkit.dev/service-created-by: ${{ values.requestedBy }}
spec:
  image: ""
  port: 8080
  size: medium
  database: ${{ values.name }}-db
{% else -%}
# Not deployed: the service was created without an environment. To deploy
# it, write here an App of the new-service Golden Path (see the Spring
# service template of the platform) and push to main.
{% endif -%}
