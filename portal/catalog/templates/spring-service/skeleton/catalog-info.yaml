apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description }}
  # The architecture (and version) this service follows: agents read its rules
  # with platform.get-standards-for-entity before changing it.
  labels:
    platform.starterkit.dev/architecture: backend-spring-v2
  annotations:
    platform.starterkit.dev/requested-by: ${{ values.requestedBy }}
    platform.starterkit.dev/template: spring-service
  tags: [java, spring-boot]
  links:
    - url: http://localhost:7007/docs/default/component/engineering-standards/backend-spring-v2/architecture-rules/
      title: Architecture rules (backend v2)
      icon: docs
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
  dependsOn:
    - airesource:default/backend-spring-v2
