[project]
name = "platform-api"
version = "0.1.0"
description = "Platform API of the Platform Engineering Starter Kit: capabilities independent of the channel"
requires-python = ">=3.12"
dependencies = [
  "jinja2==3.1.6",
  "jsonschema==4.26.0",
  "pyyaml==6.0.3",
  "kubernetes==37.0.1",
  "starlette==1.7.0",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
platform-api = "platform_api.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["platform_api"]
