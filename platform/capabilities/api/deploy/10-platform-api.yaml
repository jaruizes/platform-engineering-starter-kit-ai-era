# The platform API: the platform's capabilities, independent of the channel.
# The portal, the platform MCP server and the CLI call it with the person's
# or the agent's Keycloak token. It authorizes every operation, then acts in
# Kubernetes (its permissions are in 05-identities.yaml) and in the Git server.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-api
  namespace: platform-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-api
    spec:
      serviceAccountName: platform-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: platform-starter-kit/platform-api:dev
          imagePullPolicy: Never
          env:
            - name: PORT
              value: "8083"
            # Who issues the tokens people and agents send (the public issuer),
            # and where the platform API reads its keys (inside the cluster).
            - name: OIDC_ISSUER
              value: http://localhost:8180/realms/platform
            - name: OIDC_JWKS_URL
              value: http://keycloak.platform-system.svc:8180/realms/platform/protocol/openid-connect/certs
            - name: OIDC_AUDIENCE
              value: platform
            # Until the portal signs people in with Keycloak (increment B), it
            # calls with this channel token and states the signed-in person.
            - name: PLATFORM_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-api-token
                  key: token
            # Where the platform creates repositories (inside the cluster)...
            - name: GIT_API_URL
              value: http://gitea.platform-system.svc:3000
            # ...and where people and agents browse and clone them.
            - name: GIT_URL
              value: http://localhost:3000
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gitea-admin
                  key: username
            - name: GIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitea-admin
                  key: password
            # Delivery and quality status of services.
            - name: GITEA_INTERNAL_URL
              value: http://gitea.platform-system.svc:3000
            - name: QUALITY_GIT_URL
              value: http://gitea.platform-system.svc:3000
            - name: SONAR_HOST_URL
              value: http://sonarqube.quality.svc:9000
            - name: SONAR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sonar-pipeline-auth
                  key: token
                  optional: true
          ports:
            - name: http
              containerPort: 8083
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            # git needs a writable place for the first commit.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api
  namespace: platform-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: platform-api
  ports:
    - name: http
      port: 8083
      targetPort: http
      nodePort: 30083
