# The platform API: the platform's capabilities, independent of the channel.
# The portal, the platform MCP server and the CLI call it. It reads the state
# of environments and services, and writes the audit trail (events).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-api
  namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform:api:read
rules:
  # To check that an environment or a backend exists before creating a
  # repository that deploys into it.
  - apiGroups: [platform.starterkit.dev]
    resources: [environments, springservices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform:api:read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform:api:read
subjects:
  - kind: ServiceAccount
    name: platform-api
    namespace: platform-system
---
# The audit trail lives in platform-system, with the console's and the MCP server's.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform:api:records
  namespace: platform-system
rules:
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform:api:records
  namespace: platform-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform:api:records
subjects:
  - kind: ServiceAccount
    name: platform-api
    namespace: platform-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-api
    spec:
      serviceAccountName: platform-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: platform-starter-kit/platform-api:dev
          imagePullPolicy: Never
          env:
            - name: PORT
              value: "8083"
            # Channels (portal, MCP server, CLI) send it as a bearer token.
            - name: PLATFORM_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-api-token
                  key: token
            # Where the platform creates repositories (inside the cluster)...
            - name: GIT_API_URL
              value: http://gitea.platform-system.svc:3000
            # ...and where people and agents browse and clone them.
            - name: GIT_URL
              value: http://localhost:3000
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gitea-admin
                  key: username
            - name: GIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitea-admin
                  key: password
          ports:
            - name: http
              containerPort: 8083
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            # git needs a writable place for the first commit.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api
  namespace: platform-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: platform-api
  ports:
    - name: http
      port: 8083
      targetPort: http
      nodePort: 30083
