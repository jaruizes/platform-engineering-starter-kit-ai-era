apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: spring-service
  title: Spring service
  description: >-
    Creates a Spring Boot service that follows the engineering standards:
    module-first hexagonal packages, Maven, JPA with Flyway, OpenAPI,
    Testcontainers, ArchUnit rules that check the architecture on every build,
    and an AGENTS.md for AI agents. The repository is created in the local Git
    server and appears in the catalog on its own. With an environment, every
    push to main is built by the platform pipeline and deployed there with
    GitOps (Argo CD), together with its PostgreSQL database.
  tags: [golden-path, java, spring-boot]
  links:
    - url: http://localhost:7007/docs/default/component/engineering-standards
      title: Engineering standards
      icon: docs
spec:
  owner: platform-team
  type: service
  # Sends the signed-in person's token: the platform API decides with it.
  formDecorators:
    - id: platform-identity
  parameters:
    - title: Service
      required: [name, description, owner]
      properties:
        name:
          title: Name
          description: Repository and service name, for example inventory-service.
          type: string
          pattern: '^[a-z]([-a-z0-9]{0,38}[a-z0-9])?$'
        description:
          title: Description
          description: What the service does, in the domain language.
          type: string
        owner:
          title: Owner team
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
    - title: Architecture
      required: [basePackage, module]
      properties:
        basePackage:
          title: Base Java package
          description: The service package is the base package plus the service name without dashes.
          type: string
          default: com.starterkit
          pattern: '^[a-z][a-z0-9]*(\.[a-z][a-z0-9]*)+$'
        module:
          title: First functional module
          description: >-
            A business capability in the domain language, for example catalog or
            records. It gets its own domain, business and infrastructure packages.
          type: string
          pattern: '^[a-z][a-z0-9]*$'
    - title: Delivery
      properties:
        environment:
          title: Environment
          description: >-
            Ephemeral environment where every push to main is deployed. Leave
            it empty to only create the repository.
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Resource
              spec.type: environment
  # The platform renders the skeleton and creates the repository: this form is
  # one channel of the spring-service Golden Path (golden-path.yaml), like the platform
  # MCP server and the CLI. The request is made on behalf of the signed-in person.
  steps:
    - id: create
      name: Create the service repository with the Spring service Golden Path
      action: platform:golden-path:create
      input:
        goldenPath: spring-service
        parameters:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          basePackage: ${{ parameters.basePackage }}
          module: ${{ parameters.module }}
          environment: ${{ parameters.environment }}

  output:
    links:
      - title: Repository
        url: ${{ steps.create.output.repositoryUrl }}
      - title: Open the service in the catalog (it appears within a few seconds)
        icon: catalog
        entityRef: component:default/${{ parameters.name }}
    text:
      - title: Next steps
        content: |
          ```bash
          git clone ${{ steps.create.output.repositoryUrl }}
          cd ${{ parameters.name }} && ./mvnw verify
          ```
          `./mvnw verify` runs the architecture rules. AI agents read `AGENTS.md`.
          A push to main runs the pipeline (Actions tab of the repository) and,
          with an environment, Argo CD deploys it (http://localhost:8082).
