# Generated by API-to-MCP Golden Path. A private, namespaced HTTP MCP service.
# Gitea Actions sets spec.template.spec.containers[0].image after successful tests.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.name }}
  namespace: env-${{ values.environment }}
  labels:
    app.kubernetes.io/name: ${{ values.name }}
    app.kubernetes.io/component: mcp-adapter
  annotations:
    platform.starterkit.dev/service-created-by: ${{ values.requestedBy }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ${{ values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${{ values.name }}
        app.kubernetes.io/component: mcp-adapter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          # Image is updated by the platform pipeline before the manifest is deployed.
          image: ""
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MCP_TRANSPORT
              value: streamable-http
            - name: MCP_PORT
              value: "8080"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: REST_API_BASE_URL
              value: http://${{ values.backendService }}:80
            # Explicitly declares the ONLY backend that may use in-cluster HTTP.
            - name: REST_API_TRUSTED_CLUSTER_HOST
              value: ${{ values.backendService }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ values.name }}
  namespace: env-${{ values.environment }}
  labels:
    app.kubernetes.io/name: ${{ values.name }}
    app.kubernetes.io/component: mcp-adapter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ${{ values.name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
