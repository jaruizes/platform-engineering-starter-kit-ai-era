[project]
name = "rest-mcp-adapter"
version = "0.1.0"
description = "Reusable read-only REST API to MCP adapter"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
rest-mcp-adapter = "rest_mcp_adapter.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rest_mcp_adapter"]
