apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description }}
  annotations:
    backstage.io/source-location: url:http://localhost:3000/platform/${{ values.name }}
  tags: [mcp, zero-ui, adapter]
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: internal-developer-platform
