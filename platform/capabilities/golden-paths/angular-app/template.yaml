apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: angular-app
  title: Angular application
  description: >-
    Creates a standalone Angular frontend, container build and Kubernetes
    GitOps manifest. Optionally routes /api/ requests to a SpringService in the
    same ephemeral environment.
  tags: [golden-path, angular, frontend]
spec:
  owner: platform-team
  type: website
  # Sends the signed-in person's token: the platform API decides with it.
  formDecorators:
    - id: platform-identity
  parameters:
    - title: Application
      required: [name, description, owner]
      properties:
        name:
          title: Name
          description: Repository and application name, for example inventory-web.
          type: string
          pattern: '^[a-z]([-a-z0-9]{0,38}[a-z0-9])?$'
        description:
          title: Description
          type: string
        owner:
          title: Owner team
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
    - title: Integration
      properties:
        backendService:
          title: Spring service name
          description: >-
            Optional SpringService in the same environment. The generated Nginx
            configuration forwards /api/ requests to it.
          type: string
          pattern: '^$|^[a-z]([-a-z0-9]{0,38}[a-z0-9])?$'
    - title: Delivery
      properties:
        environment:
          title: Environment
          description: >-
            Ephemeral environment where every push to main is deployed. Leave
            empty to only create the repository.
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Resource
              spec.type: environment
  # The platform renders the skeleton and creates the repository: this form is
  # one channel of the angular-app Golden Path (golden-path.yaml), like the platform
  # MCP server and the CLI. The request is made on behalf of the signed-in person.
  steps:
    - id: create
      name: Create the application repository with the Angular Golden Path
      action: platform:golden-path:create
      input:
        goldenPath: angular-app
        parameters:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          backendService: ${{ parameters.backendService }}
          environment: ${{ parameters.environment }}

  output:
    links:
      - title: Repository
        url: ${{ steps.create.output.repositoryUrl }}
      - title: Open the application in the catalog
        icon: catalog
        entityRef: component:default/${{ parameters.name }}
    text:
      - title: Next steps
        content: |
          ```bash
          git clone ${{ steps.create.output.repositoryUrl }}
          cd ${{ parameters.name }} && npm install && npm run lint && npm test && npm run build
          ```
          A push to main builds the container and, with an environment, Argo CD
          deploys the `App` resource into Kubernetes.
