# Generated Angular application: explicit classification for SonarQube.
# A spec.ts is a test, not production code. Keep both sets disjoint.
sonar.sources=src
sonar.tests=src
sonar.exclusions=**/*.spec.ts
sonar.test.inclusions=**/*.spec.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
