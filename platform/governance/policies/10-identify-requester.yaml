# Step "Identify": every request is stamped with who made it, human or
# agent, taken from the authenticated identity, not from what the client says.
# It also turns the requested time to live into a deletion date.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: identify-requester
  annotations:
    policies.kyverno.io/title: Identify the requester
    policies.kyverno.io/description: >-
      Records the authenticated requester of every Golden Path request and
      whether it is a human or an AI agent, and sets the time to live.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [platform.starterkit.dev]
        apiVersions: ["*"]
        operations: [CREATE]
        # Every Golden Path and capability.
        resources: ["*"]
  variables:
    - name: agentIdentity
      expression: "'system:serviceaccount:platform-system:platform-mcp'"
    # The platform API acts for people as itself, and for agents as the
    # agents' identity above (impersonation), after checking their tokens.
    # It also replays, as itself, an agent's request that a person approved.
    - name: apiIdentity
      expression: "'system:serviceaccount:platform-system:platform-api'"
    - name: approvedAgentRequest
      expression: >-
        request.userInfo.username == variables.apiIdentity &&
        object.metadata.?annotations[?'platform.starterkit.dev/approved-by'].orValue('') != '' &&
        object.metadata.?annotations[?'platform.starterkit.dev/agent'].orValue('') != ''
    # GitOps (Argo CD) delivers what a service repository declares. The
    # requester is whoever created the service, recorded in the repository
    # by the Spring service template; the commits are the rest of the trail.
    - name: gitopsIdentity
      expression: "'system:serviceaccount:argocd:argocd-application-controller'"
    - name: serviceCreatedBy
      expression: >-
        object.metadata.?annotations[?'platform.starterkit.dev/service-created-by'].orValue('')
    - name: requesterType
      expression: >-
        request.userInfo.username == variables.agentIdentity || variables.approvedAgentRequest ? 'agent' :
        request.userInfo.username == variables.gitopsIdentity && variables.serviceCreatedBy.startsWith('agent:') ? 'agent' :
        'human'
    # Agents act through the platform API, which acts as the agents' identity
    # and names the agent (from its Keycloak token). An approved agent request
    # keeps the agent as requester. For people, the platform API passes on the
    # signed-in person (from their Keycloak token, whatever the channel).
    - name: requestedBy
      expression: >-
        request.userInfo.username == variables.gitopsIdentity && variables.serviceCreatedBy != ''
          ? variables.serviceCreatedBy.replace('agent:', '')
          : variables.requesterType == 'agent'
            ? object.metadata.?annotations[?'platform.starterkit.dev/agent'].orValue(request.userInfo.username)
            : request.userInfo.username == variables.apiIdentity
              ? object.metadata.?annotations[?'platform.starterkit.dev/on-behalf-of'].orValue(request.userInfo.username)
              : request.userInfo.username
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            metadata: Object.metadata{
              annotations: {
                "platform.starterkit.dev/requested-by": string(variables.requestedBy),
                "platform.starterkit.dev/requester-type": string(variables.requesterType),
                "platform.starterkit.dev/delivered-by":
                  request.userInfo.username == variables.gitopsIdentity ? 'gitops' : 'api'
              }
            }
          }
    # Environments expire: Kyverno deletes them when the time to live is over.
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          object.kind != 'Environment' ? Object{} :
          Object{
            metadata: Object.metadata{
              labels: {
                "cleanup.kyverno.io/ttl": string(object.spec.ttlHours) + "h",
                "platform.starterkit.dev/team": string(object.spec.team)
              }
            }
          }
