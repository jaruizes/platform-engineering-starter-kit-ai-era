# Guardrails for AI agents: the more autonomous the consumer, the stronger
# the guardrails. Agents get small environments on their own; anything
# bigger goes to an approver of the team, through the platform API.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: agent-guardrails
  annotations:
    policies.kyverno.io/title: Agent guardrails
    policies.kyverno.io/description: >-
      Agents can only request small environments and only deploy into
      ephemeral environments. Larger requests need human approval.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [platform.starterkit.dev]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: ["*"]
  matchConditions:
    - name: requested-by-an-agent
      # The platform MCP server, or GitOps delivering a service an agent created.
      expression: >-
        request.userInfo.username == 'system:serviceaccount:platform-system:platform-mcp' ||
        (request.userInfo.username == 'system:serviceaccount:argocd:argocd-application-controller' &&
         object.metadata.?annotations[?'platform.starterkit.dev/service-created-by'].orValue('').startsWith('agent:'))
  validations:
    # Updates only check what changes (the platform API records who deletes
    # an environment just before deleting it).
    - expression: >-
        object.kind != 'Environment' || object.spec.size == 'small' ||
        (request.operation == 'UPDATE' && object.spec.size == oldObject.spec.size)
      messageExpression: >-
        'Human approval required: agents can only request small environments on their own, requested ' +
        object.spec.size + '.'
      reason: Forbidden
    - expression: object.kind != 'SpringService' || object.metadata.namespace.startsWith('env-')
      message: Agents can only deploy services into ephemeral environments (env-* namespaces).
      reason: Forbidden
    - expression: object.kind != 'App' || object.metadata.namespace.startsWith('env-')
      message: Agents can only deploy frontend applications into ephemeral environments (env-* namespaces).
      reason: Forbidden
    - expression: >-
        request.operation == 'UPDATE' || !has(object.metadata.annotations) ||
        !('platform.starterkit.dev/approved-by' in object.metadata.annotations)
      message: Agents cannot approve their own requests.
      reason: Forbidden
---
# Requester and approval records cannot be forged or changed afterwards.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: protect-audit-trail
  annotations:
    policies.kyverno.io/title: Protect the audit trail
    policies.kyverno.io/description: >-
      Only the platform API can record an approval (after checking the
      approver role and four eyes) and say who a request is for, and
      requester annotations cannot be changed after creation.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [platform.starterkit.dev]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: ["*"]
  variables:
    - name: keys
      expression: >-
        ['platform.starterkit.dev/requested-by', 'platform.starterkit.dev/requester-type',
         'platform.starterkit.dev/approved-by', 'platform.starterkit.dev/on-behalf-of',
         'platform.starterkit.dev/delivered-by', 'platform.starterkit.dev/agent',
         'platform.starterkit.dev/requester-teams', 'platform.starterkit.dev/agent-chain']
    # The platform API, as itself or as the agents' identity.
    - name: platformIdentities
      expression: >-
        ['system:serviceaccount:platform-system:platform-api',
         'system:serviceaccount:platform-system:platform-mcp']
    - name: deletionKeys
      expression: >-
        ['platform.starterkit.dev/deleted-by', 'platform.starterkit.dev/deleter-teams',
         'platform.starterkit.dev/deleted-on-behalf-of']
    - name: annotations
      expression: object.metadata.?annotations.orValue({})
    - name: oldAnnotations
      expression: "request.operation == 'UPDATE' ? oldObject.metadata.?annotations.orValue({}) : {}"
  validations:
    - expression: >-
        !('platform.starterkit.dev/approved-by' in variables.annotations) ||
        request.operation == 'UPDATE' ||
        request.userInfo.username == 'system:serviceaccount:platform-system:platform-api'
      message: Approvals can only be recorded through the platform API, by an approver of the team.
      reason: Forbidden
    - expression: >-
        !('platform.starterkit.dev/on-behalf-of' in variables.annotations) ||
        request.operation == 'UPDATE' ||
        request.userInfo.username in variables.platformIdentities
      message: Only the platform API can act on behalf of a person.
      reason: Forbidden
    - expression: >-
        request.operation == 'UPDATE' || request.userInfo.username in variables.platformIdentities ||
        !['platform.starterkit.dev/agent', 'platform.starterkit.dev/requester-teams',
          'platform.starterkit.dev/agent-chain'].exists(k, k in variables.annotations)
      message: >-
        Only the platform API records the agent, the requester's teams and the agent chain (from the
        Keycloak token).
      reason: Forbidden
    - expression: >-
        request.userInfo.username in ['system:serviceaccount:platform-system:platform-api',
                                      'system:serviceaccount:platform-system:platform-mcp'] ||
        variables.deletionKeys.all(k, variables.annotations[?k].orValue('') ==
          (request.operation == 'UPDATE' ? variables.oldAnnotations[?k].orValue('') : ''))
      message: Only the platform API records who deletes a resource.
      reason: Forbidden
    - expression: >-
        request.operation == 'CREATE' ||
        variables.keys.all(k, variables.annotations[?k].orValue('') == variables.oldAnnotations[?k].orValue(''))
      message: Requester and approval annotations cannot be changed.
      reason: Forbidden
---
# Agents only delete what an agent requested for the same person (or the
# same autonomous agent). The platform API checks it first; this is the
# second line in Kubernetes, for every Golden Path and capability. Just
# before deleting, the platform API records who deletes and for whom
# (deleted-by, deleted-on-behalf-of, deleter-teams). People delete through
# the platform API, the portal or kubectl; expired environments are removed
# by Kyverno itself.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: agent-deletes
  annotations:
    policies.kyverno.io/title: Agents only delete what agents requested
    policies.kyverno.io/description: >-
      An AI agent cannot delete environments, services or capabilities that a
      person, or an agent of another person, requested.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [platform.starterkit.dev]
        apiVersions: ["*"]
        operations: [DELETE]
        resources: ["*"]
  matchConditions:
    - name: deleted-by-an-agent
      expression: request.userInfo.username == 'system:serviceaccount:platform-system:platform-mcp'
  variables:
    - name: annotations
      expression: oldObject.metadata.?annotations.orValue({})
    - name: onBehalfOf
      expression: variables.annotations[?'platform.starterkit.dev/on-behalf-of'].orValue('')
  validations:
    - expression: >-
        variables.annotations[?'platform.starterkit.dev/requester-type'].orValue('') == 'agent'
      messageExpression: >-
        'Agents can only delete what an agent requested: ' + oldObject.kind + ' ' + oldObject.metadata.name +
        ' was requested by ' +
        variables.annotations[?'platform.starterkit.dev/requested-by'].orValue('a person') + '.'
      reason: Forbidden
    - expression: >-
        variables.onBehalfOf != ''
          ? variables.onBehalfOf == variables.annotations[?'platform.starterkit.dev/deleted-on-behalf-of'].orValue('')
          : variables.annotations[?'platform.starterkit.dev/requested-by'].orValue('') ==
            variables.annotations[?'platform.starterkit.dev/deleted-by'].orValue('-')
      messageExpression: >-
        'Agents can only delete what an agent requested for the same person: ' + oldObject.kind + ' ' +
        oldObject.metadata.name + ' was requested for ' +
        (variables.onBehalfOf != '' ? variables.onBehalfOf :
         variables.annotations[?'platform.starterkit.dev/requested-by'].orValue('someone else')) + '.'
      reason: Forbidden
