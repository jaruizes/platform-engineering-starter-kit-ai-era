# Team scope on delete (policy team-membership): the platform API records
# the deleter's teams just before deleting.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: team-membership-delete
policies:
  - ../../40-team-membership.yaml
resources:
  - resources.yaml
variables: values.yaml
userinfo: user-info.yaml
results:
  - policy: team-membership
    isValidatingPolicy: true
    resources: [checkout-dev]
    kind: Environment
    result: pass
  - policy: team-membership
    isValidatingPolicy: true
    resources: [payments-dev, unmarked]
    kind: Environment
    result: fail
