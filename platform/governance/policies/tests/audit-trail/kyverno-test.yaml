# Nobody but the platform API says who a request is for (policy
# protect-audit-trail): a person with kubectl access tries to forge it.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: protect-audit-trail
policies:
  - ../../30-agent-guardrails.yaml
resources:
  - resources.yaml
userinfo: user-info.yaml
results:
  - policy: protect-audit-trail
    isValidatingPolicy: true
    resources: [plain]
    kind: Environment
    result: pass
  - policy: protect-audit-trail
    isValidatingPolicy: true
    resources: [forged-agent, forged-teams, forged-person, forged-deletion]
    kind: Environment
    result: fail
