# The rule is only for agents: people delete with their own permissions.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: person-deletes
policies:
  - ../../30-agent-guardrails.yaml
resources:
  - resources.yaml
variables: values.yaml
userinfo: user-info.yaml
results:
  - policy: agent-deletes
    isValidatingPolicy: true
    resources: [agent-load-test, payments-dev, unstamped]
    kind: Environment
    result: skip
