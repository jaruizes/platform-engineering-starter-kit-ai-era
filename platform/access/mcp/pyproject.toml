[project]
name = "platform-mcp"
version = "0.1.0"
description = "Platform MCP server (a channel of the platform API) for the Platform Engineering Starter Kit"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.3.0",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
platform-mcp = "platform_mcp.mcp_server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["platform_mcp"]
