# The platform MCP server: a channel of the platform API for AI agents. It
# has no Kubernetes access of its own: it checks that agents bring a Keycloak
# token and forwards it to the platform API, which decides.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-mcp-server
  namespace: platform-system
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-mcp
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-mcp
    spec:
      serviceAccountName: platform-mcp-server
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform
          image: platform-starter-kit/platform-mcp:dev
          imagePullPolicy: Never
          command: [platform-mcp]
          env:
            - name: PORT
              value: "8081"
            - name: MCP_ALLOWED_HOSTS
              value: "localhost:*,127.0.0.1:*,platform-mcp.platform-system.svc:*"
            # OAuth 2.1 resource server: agents sign their person in with
            # Keycloak and send the token; the MCP server forwards it.
            - name: MCP_RESOURCE_URL
              value: http://localhost:8081/mcp
            - name: OIDC_ISSUER
              value: http://localhost:8180/realms/platform
            # Where the repositories created by create_service are browsed.
            - name: GIT_URL
              value: http://localhost:3000
            # Shown by the scripted agent (make demo-agent).
            - name: CONSOLE_URL
              value: http://localhost:8080
            # Every tool is a platform API operation, with or without a portal.
            - name: PLATFORM_API_URL
              value: http://platform-api.platform-system.svc:8083
            # The scripted agent (make demo-agent) is the autonomous agent
            # ci-agent: it gets its own token from Keycloak, inside the cluster.
            - name: OIDC_TOKEN_ISSUER
              value: http://keycloak.platform-system.svc:8180/realms/platform
            - name: AGENT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ci-agent-client
                  key: secret
            # The Git server account agents push service changes with.
            - name: GIT_PUSH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gitea-developer
                  key: username
                  optional: true
            - name: GIT_PUSH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitea-developer
                  key: password
                  optional: true
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: platform-mcp
  namespace: platform-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: platform-mcp
  ports:
    - name: http
      port: 8081
      targetPort: http
      nodePort: 30081
