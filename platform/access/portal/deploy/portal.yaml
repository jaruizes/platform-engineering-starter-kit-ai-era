# The developer portal (Backstage). People sign in with Keycloak and the
# portal calls the platform API with their token: the platform API decides and
# acts. The portal's own Kubernetes identity only reads (catalog, Kubernetes
# tab and the agents' context): it creates nothing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portal
  namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform:portal
rules:
  # Golden Paths and capabilities: read-only.
  - apiGroups: [platform.starterkit.dev]
    resources: ["*"]
    verbs: [get, list, watch]
  # To find the capabilities the platform offers and build their forms.
  - apiGroups: [apiextensions.crossplane.io]
    resources: [compositeresourcedefinitions]
    verbs: [get, list, watch]
  # Read-only view of workloads for the Kubernetes tab and for agents.
  - apiGroups: [""]
    resources: [pods, services, configmaps, limitranges, resourcequotas]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform:portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform:portal
subjects:
  - kind: ServiceAccount
    name: portal
    namespace: platform-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: platform-system
  labels:
    app.kubernetes.io/name: portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal
    spec:
      serviceAccountName: portal
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: platform-ca
          configMap:
            name: platform-ca
            optional: true
      containers:
        - name: portal
          image: platform-starter-kit/portal:dev
          imagePullPolicy: Never
          env:
            # Where people reach the portal. Off localhost, the start script
            # rewrites the local addresses of its configuration and catalog.
            - name: PUBLIC_URL
              value: http://localhost:7007
            - name: PORTAL_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: portal-mcp-token
                  key: token
            # Its client in Keycloak, to sign people in.
            - name: AUTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: portal-oidc-client
                  key: secret
            - name: GITEA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gitea-admin
                  key: username
            - name: GITEA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitea-admin
                  key: password
          ports:
            - name: http
              containerPort: 7007
          readinessProbe:
            httpGet:
              path: /.backstage/health/v1/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1536Mi
          # The CA of the public address, when it is not a public one (AWS).
          volumeMounts:
            - name: platform-ca
              mountPath: /etc/platform-ca
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
        # Makes the Git server reachable at localhost:3000 inside the pod, the
        # same address the browser uses, so repository links work everywhere.
        - name: git-proxy
          image: alpine/socat:1.8.1.3
          args: ["TCP-LISTEN:3000,fork,reuseaddr", "TCP:gitea.platform-system.svc:3000"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: platform-system
  labels:
    app.kubernetes.io/name: portal
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: portal
  ports:
    - name: http
      port: 7007
      targetPort: http
      nodePort: 30007
