apiVersion: v1
kind: Namespace
metadata:
  name: quality
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarqube-data
  namespace: quality
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube
  namespace: quality
spec:
  replicas: 1
  selector:
    matchLabels: {app: sonarqube}
  template:
    metadata:
      labels: {app: sonarqube}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: sonarqube
          image: sonarqube:community
          ports:
            - name: http
              containerPort: 9000
          env:
            - name: SONAR_ES_BOOTSTRAP_CHECKS_DISABLE
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /opt/sonarqube/data
          readinessProbe:
            httpGet: {path: /api/system/status, port: http}
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {memory: 4Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: sonarqube-data}
---
apiVersion: v1
kind: Service
metadata:
  name: sonarqube
  namespace: quality
spec:
  selector: {app: sonarqube}
  ports:
    - name: http
      port: 9000
      targetPort: http
