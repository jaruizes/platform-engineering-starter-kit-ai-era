apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: app
spec:
  compositeTypeRef:
    apiVersion: platform.starterkit.dev/v1alpha1
    kind: App
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $name := $xr.metadata.name }}
            {{- $ns := $xr.metadata.namespace }}
            {{- $replicas := $xr.spec.replicas | default 1 }}
            {{- $sizes := dict
                  "small"  (dict "cpu" "250m" "memory" "256Mi")
                  "medium" (dict "cpu" "500m" "memory" "512Mi") }}
            {{- $size := get $sizes ($xr.spec.size | default "small") }}
            {{- $db := $xr.spec.database | default "" }}
            {{- $deploy := dig "resources" "deployment" "resource" dict .observed }}
            {{- $available := dig "status" "availableReplicas" 0 $deploy }}
            {{- /* No image yet: the service's pipeline has not built one. */}}
            {{- if $xr.spec.image }}
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: {{ $name }}
              labels:
                app.kubernetes.io/name: {{ $name }}
                app.kubernetes.io/managed-by: platform
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: deployment
                {{- if ge (int $available) (int $replicas) }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
            spec:
              replicas: {{ $replicas }}
              selector:
                matchLabels:
                  app.kubernetes.io/name: {{ $name }}
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: {{ $name }}
                    app.kubernetes.io/managed-by: platform
                spec:
                  automountServiceAccountToken: false
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 10001
                    runAsGroup: 10001
                    seccompProfile:
                      type: RuntimeDefault
                  containers:
                    - name: app
                      image: {{ $xr.spec.image }}
                      ports:
                        - name: http
                          containerPort: {{ $xr.spec.port }}
                      {{- if $db }}
                      env:
                        {{- range $var, $key := dict "DATABASE_HOST" "host" "DATABASE_PORT" "port" "DATABASE_NAME" "database" "DATABASE_USERNAME" "username" "DATABASE_PASSWORD" "password" }}
                        - name: {{ $var }}
                          valueFrom:
                            secretKeyRef:
                              name: {{ $db }}-connection
                              key: {{ $key }}
                        {{- end }}
                        - name: SPRING_DATASOURCE_URL
                          value: jdbc:postgresql://$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)
                        - name: SPRING_DATASOURCE_USERNAME
                          value: $(DATABASE_USERNAME)
                        - name: SPRING_DATASOURCE_PASSWORD
                          value: $(DATABASE_PASSWORD)
                      {{- end }}
                      # Slow starters (a JVM on a quarter of a CPU) get up to
                      # three minutes before the liveness probe counts.
                      startupProbe:
                        tcpSocket:
                          port: http
                        periodSeconds: 5
                        failureThreshold: 36
                      readinessProbe:
                        tcpSocket:
                          port: http
                      livenessProbe:
                        tcpSocket:
                          port: http
                      resources:
                        requests:
                          cpu: 50m
                          memory: 64Mi
                        limits:
                          cpu: {{ $size.cpu }}
                          memory: {{ $size.memory }}
                      securityContext:
                        allowPrivilegeEscalation: false
                        capabilities:
                          drop: [ALL]
            ---
            {{- end }}
            apiVersion: v1
            kind: Service
            metadata:
              name: {{ $name }}
              labels:
                app.kubernetes.io/name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: service
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              selector:
                app.kubernetes.io/name: {{ $name }}
              ports:
                - name: http
                  port: 80
                  targetPort: http
            ---
            apiVersion: {{ $xr.apiVersion }}
            kind: {{ $xr.kind }}
            status:
              url: http://{{ $name }}.{{ $ns }}.svc.cluster.local
