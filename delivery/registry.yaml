# Local only: the registry the pipelines push service images to. The nodes
# pull from its fixed address (k3d registry mirror in
# bootstrap/local/k3d-config.yaml). On AWS the images go to ECR instead.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: service-images
  namespace: platform-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-images
  namespace: platform-system
  labels:
    app.kubernetes.io/name: service-images
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: service-images
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-images
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: registry:3.1.2
          ports:
            - name: registry
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /v2/
              port: registry
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: service-images
---
apiVersion: v1
kind: Service
metadata:
  name: service-images
  namespace: platform-system
spec:
  # Fixed (from the range Kubernetes keeps for fixed addresses), so the
  # nodes can pull from it without cluster DNS.
  clusterIP: 10.43.0.200
  selector:
    app.kubernetes.io/name: service-images
  ports:
    - name: registry
      port: 5000
      targetPort: registry
