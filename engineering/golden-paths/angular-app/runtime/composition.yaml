apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: angular-app
spec:
  compositeTypeRef:
    apiVersion: platform.starterkit.dev/v1alpha1
    kind: App
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $name := $xr.metadata.name }}
            {{- $ns := $xr.metadata.namespace }}
            {{- $replicas := $xr.spec.replicas | default 1 }}
            {{- $backend := $xr.spec.backendService | default "" }}
            {{- $deploy := dig "resources" "deployment" "resource" dict .observed }}
            {{- $available := dig "status" "availableReplicas" 0 $deploy }}
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: {{ $name }}-nginx
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: nginx-config
                gotemplating.fn.crossplane.io/ready: "True"
            data:
              default.conf: |
                server {
                    listen 8080;
                    server_name _;
                    root /usr/share/nginx/html;
                    index index.html;
                    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
                    add_header X-Content-Type-Options "nosniff" always;
                    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                    location = /healthz { access_log off; return 200 "ok"; }
                    {{- if $backend }}
                    location /api/ {
                        proxy_pass http://{{ $backend }}.{{ $ns }}.svc.cluster.local;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                    }
                    {{- end }}
                    location / { try_files $uri $uri/ /index.html; }
                }
            {{ if $xr.spec.image }}
            ---
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: {{ $name }}
              namespace: {{ $ns }}
              labels:
                app.kubernetes.io/name: {{ $name }}
                app.kubernetes.io/managed-by: platform
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: deployment
                {{- if ge (int $available) (int $replicas) }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
            spec:
              replicas: {{ $replicas }}
              strategy:
                type: RollingUpdate
                rollingUpdate:
                  maxSurge: 0
                  maxUnavailable: 1
              selector:
                matchLabels:
                  app.kubernetes.io/name: {{ $name }}
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: {{ $name }}
                    app.kubernetes.io/managed-by: platform
                spec:
                  automountServiceAccountToken: false
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 101
                    runAsGroup: 101
                    fsGroup: 101
                    seccompProfile:
                      type: RuntimeDefault
                  containers:
                    - name: frontend
                      image: {{ $xr.spec.image }}
                      ports:
                        - name: http
                          containerPort: {{ $xr.spec.port | default 8080 }}
                      startupProbe:
                        httpGet:
                          path: /healthz
                          port: http
                        periodSeconds: 5
                        failureThreshold: 12
                      readinessProbe:
                        httpGet:
                          path: /healthz
                          port: http
                      livenessProbe:
                        httpGet:
                          path: /healthz
                          port: http
                      resources:
                        requests:
                          cpu: 50m
                          memory: 64Mi
                        limits:
                          cpu: 250m
                          memory: 256Mi
                      securityContext:
                        allowPrivilegeEscalation: false
                        capabilities:
                          drop: [ALL]
                      volumeMounts:
                        - name: nginx-config
                          mountPath: /etc/nginx/conf.d/default.conf
                          subPath: default.conf
                        - name: nginx-cache
                          mountPath: /var/cache/nginx
                        - name: nginx-run
                          mountPath: /var/run
                  volumes:
                    - name: nginx-config
                      configMap:
                        name: {{ $name }}-nginx
                    - name: nginx-cache
                      emptyDir: {}
                    - name: nginx-run
                      emptyDir: {}
            {{ end }}
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: {{ $name }}
              namespace: {{ $ns }}
              labels:
                app.kubernetes.io/name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: service
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              selector:
                app.kubernetes.io/name: {{ $name }}
              ports:
                - name: http
                  port: 80
                  targetPort: http
            ---
            apiVersion: {{ $xr.apiVersion }}
            kind: {{ $xr.kind }}
            status:
              url: http://{{ $name }}.{{ $ns }}.svc.cluster.local
