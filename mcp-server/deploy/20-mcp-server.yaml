apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-mcp
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-mcp
    spec:
      serviceAccountName: platform-mcp
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform
          image: platform-starter-kit/platform-mcp:dev
          imagePullPolicy: Never
          command: [platform-mcp]
          env:
            - name: PORT
              value: "8081"
            - name: MCP_ALLOWED_HOSTS
              value: "localhost:*,127.0.0.1:*,platform-mcp.platform-system.svc:*"
            # Agents must send it as a bearer token. Empty on localhost.
            - name: MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-mcp-token
                  key: token
                  optional: true
            # Where the repositories created by create_service are browsed.
            - name: GIT_URL
              value: http://localhost:3000
            # Shown by the scripted agent (make demo-agent).
            - name: CONSOLE_URL
              value: http://localhost:8080
            # Lets create_service run the portal's Spring service template.
            - name: PORTAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-mcp-portal-token
                  key: token
            # The Git server account agents push service changes with.
            - name: GIT_PUSH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gitea-developer
                  key: username
                  optional: true
            - name: GIT_PUSH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitea-developer
                  key: password
                  optional: true
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: platform-mcp
  namespace: platform-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: platform-mcp
  ports:
    - name: http
      port: 8081
      targetPort: http
      nodePort: 30081
